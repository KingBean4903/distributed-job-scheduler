services:
  postgres:
    build: 
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: scheduler_benchmark
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: benchmark_only_password
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_wait_sampling"
    volumes:
      - pgdata:/var/lib/postgresql/data	
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 30

  scheduler-a:
    image: distributed-job-scheduler:local
    environment: &scheduler_env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scheduler_benchmark
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: benchmark_only_password
      SCHEDULER_INSTANCE_ID: benchmark-a
      SCHEDULER_ENABLED: "true"
      SCHEDULER_BENCHMARK_ENABLED:  "false"
      SCHEDULER_WORKER_THREADS: "16"
      SCHEDULER_WORKER_BATCH_SIZE: "10"
      SCHEDULER_BENCHMARK_JOB_COUNT: "100000"
      SCHEDULER_BENCHMARK_TIMEOUT: "330s"
      SCHEDULER_BENCHMARK_POLL_INTERVAL: "1s"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler-b:
    image: distributed-job-scheduler:local
    environment:
      <<: *scheduler_env
      SCHEDULER_INSTANCE_ID: benchmark-b
    depends_on:
      postgres:
        condition: service_healthy

  benchmark-runner:
    image: distributed-job-scheduler:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scheduler_benchmark
      SPRING_DATASOURCE_USERNAME: scheduler
      SPRING_DATASOURCE_PASSWORD: benchmark_only_password
      SCHEDULER_ENABLED: "false"
      SCHEDULER_BENCHMARK_ENABLED: "true"
      SCHEDULER_BENCHMARK_JOB_COUNT: "100000"
      SCHEDULER_BENCHMARK_TIMEOUT: "330s"
      SCHEDULER_BENCHMARK_POLL_INTERVAL: "1s"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["seed"]

volumes:
  pgdata: