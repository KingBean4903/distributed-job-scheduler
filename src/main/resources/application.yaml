spring:
  application:
    name: distributed-job-scheduler

  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: scheduler
    password: scheduler

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    out-of-order: true
  main:
    allow-bean-definition-overriding: true

scheduler:
  worker:
    threads: 4
    batch-size: 10
    lease-duration-seconds: 30
    heartbeat-interval-millis: 10000

server:
  port: 9800