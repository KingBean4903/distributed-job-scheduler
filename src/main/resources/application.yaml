spring:
  application:
    name: distributed-job-scheduler

  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: scheduler
    password: scheduler
    hikari:
      register-mbeans: true
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    out-of-order: true
  main:
    allow-bean-definition-overriding: true

scheduler:
  worker:
    threads: 4
    batch-size: 10
    lease-duration-seconds: 30
    heartbeat-interval-millis: 10000

logging:
  console:
    enabled: true
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.example.demo.execution.worker: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    metrics:
      access: unrestricted	
        
server:
  port: 9800